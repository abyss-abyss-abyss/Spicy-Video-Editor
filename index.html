<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spicy Editor</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0b0d">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bebas+Neue&family=Pacifico&family=Playfair+Display:wght@700&family=Permanent+Marker&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0d;--panel:#101013;--panel2:#141418;--card:#1a1a1f;--hover:#222228;--line:#1e1e24;--line2:#2a2a31;
  --text:#ececef;--dim:#83838d;--faint:#55555e;
  --accent:#ff5a36;--accent-hi:#ff7a5c;--accent-ink:#1a0703;--accent-a:#ff5a3622;
  --danger:#ff6b6b;--track:#0d0d10;
  --aiw:340px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px Inter,"Segoe UI",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2a2a31;border-radius:8px}::-webkit-scrollbar-thumb:hover{background:#383840}::-webkit-scrollbar-track{background:transparent}
svg.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
svg.ic.sm{width:15px;height:15px}svg.ic.lg{width:22px;height:22px}
button{font:inherit;cursor:pointer;border:1px solid transparent;border-radius:8px;padding:6px 12px;background:var(--card);color:var(--text);transition:background .12s,border-color .12s,color .12s,transform .08s,box-shadow .12s;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
button:hover{background:var(--hover);border-color:var(--line2)}
button:active{transform:translateY(1px) scale(.98)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button:disabled{opacity:.45;cursor:default;transform:none}
button.primary{background:var(--accent);color:var(--accent-ink);font-weight:700;border-color:transparent;box-shadow:0 1px 0 #ffffff30 inset,0 4px 14px #ff5a3630}
button.primary:hover{background:var(--accent-hi)}
button.ghost{background:transparent}
button.ghost:hover{background:var(--card)}
button.on{background:var(--accent-a);color:var(--accent);border-color:#ff5a3660}
button.danger{color:var(--danger)}
.ib{background:transparent;padding:0;width:32px;height:32px;color:#c9c9cf;border-radius:8px}
.ib:hover{background:var(--card);color:#fff;border-color:var(--line2)}
.ib.on{color:var(--accent);background:var(--accent-a)}
input,select,textarea{font:inherit;background:var(--panel2);color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:7px 9px;width:100%;outline:none;transition:border-color .12s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--accent);height:18px}
input[type=color]{padding:2px;height:32px}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
label{display:block;font-size:11.5px;color:var(--dim);margin:12px 0 5px;font-weight:500}
label.inl{display:flex;align-items:center;gap:6px;margin:8px 0;color:var(--text)}
.app{display:grid;height:100%;grid-template-columns:64px 288px minmax(0,1fr) 296px var(--aiw);grid-template-rows:48px minmax(0,1fr) 256px;
  grid-template-areas:"top top top top top" "rail assets stage side ai" "tl tl tl tl ai";gap:1px;background:#050506}
.app.noai{--aiw:0px}
.top{grid-area:top;display:flex;align-items:center;gap:4px;padding:0 12px;background:var(--panel);position:relative}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:.1px;margin-right:14px}
.logo svg{width:26px;height:26px}
.pname{position:absolute;left:50%;transform:translateX(-50%);background:transparent;border:1px solid transparent;text-align:center;width:260px;color:var(--dim)}
.pname:hover{border-color:var(--line2)}.pname:focus{color:var(--text);background:var(--panel2)}
.grow{flex:1}
.status{font-size:12px;color:var(--dim);margin-right:8px;max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail{grid-area:rail;background:var(--panel);display:flex;flex-direction:column;align-items:center;padding-top:8px;gap:2px}
.rail button{width:56px;background:transparent;flex-direction:column;gap:5px;padding:9px 0 7px;font-size:10.5px;color:var(--dim);border-radius:10px;border:0}
.rail button svg{width:21px;height:21px;color:#b9b9c0}
.rail button:hover{background:var(--card);color:var(--text)}
.rail button.on{color:var(--accent);background:var(--accent-a)}
.rail button.on svg{color:var(--accent)}
.assets{grid-area:assets;background:var(--panel);display:flex;flex-direction:column;min-height:0}
.ahead{padding:14px 14px 10px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.asec{flex:1;overflow:auto;padding:0 14px 14px;min-height:0}
.drop{border:1.5px dashed #2c2c34;border-radius:10px;padding:16px 10px;text-align:center;color:var(--dim);font-size:12px;margin-bottom:12px;background:var(--panel2);display:flex;flex-direction:column;align-items:center;gap:6px}
.drop.over{border-color:var(--accent);color:var(--accent)}
.media{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}
.mi{background:var(--panel2);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;position:relative}
.mi .th{aspect-ratio:16/10;background:#000 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#5d5d66}
.mi .nm{font-size:11px;padding:5px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#cfcfd4}
.mi .du{position:absolute;top:5px;right:5px;font-size:10px;background:#000c;padding:1px 5px;border-radius:4px;font-variant-numeric:tabular-nums}
.mi .use{position:absolute;top:5px;left:5px;font-size:9.5px;background:var(--accent);color:var(--accent-ink);padding:1px 5px;border-radius:4px;font-weight:700}
.mi .acts{position:absolute;right:5px;bottom:27px;display:none;gap:4px}
.mi .acts button{width:24px;height:24px;padding:0;border-radius:7px;background:#000d;border-color:#ffffff1a}
.mi .acts button.add{background:var(--accent);color:var(--accent-ink)}
.mi .acts button.rm:hover{color:var(--danger)}
.mi:hover{border-color:var(--accent)}
.mi:hover .acts{display:flex}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px 8px}
.tile{cursor:pointer;text-align:center;font-size:11px;color:#cfcfd4;min-width:0}
.tile .tn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:capitalize}
.tile .pv{aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#000 center/cover;margin-bottom:5px;display:flex;align-items:center;justify-content:center;position:relative;border:1px solid var(--line)}
.tile canvas{width:100%;height:100%;display:block}
.tile:hover .pv,.tile.on .pv{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tile .dl{position:absolute;right:4px;bottom:4px;width:22px;height:22px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:none;align-items:center;justify-content:center}
.tile:hover .dl{display:flex}
.cath{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:16px 0 8px;font-weight:700;display:flex;justify-content:space-between}
.textpv{font-size:26px;line-height:1;padding:4px 8px;border-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-size:12px;padding:5px 10px;border-radius:999px;background:var(--panel2);border-color:var(--line2)}
.chips button:hover{border-color:#3a3a43}
.chips button.on{background:var(--accent-a);border-color:#ff5a3670;color:var(--accent)}
.search{position:relative;margin-bottom:10px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--dim)}
.search input{padding-left:34px}
.alist{display:flex;flex-direction:column;gap:4px}
.ar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px;border-radius:10px;border:1px solid transparent}
.ar:hover{background:var(--panel2);border-color:var(--line2)}
.ar .pp{width:36px;height:36px;border-radius:10px;padding:0;background:var(--card);flex:none}
.ar .pp.playing{background:var(--accent);color:var(--accent-ink)}
.ar .info{flex:1;min-width:0}
.ar .t1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:12.5px}
.ar .t2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;color:var(--dim);margin-top:2px}
.ar .addb{width:30px;height:30px;padding:0;flex:none}
.ar .addb.busy{opacity:.6;pointer-events:none}
.badge{display:inline-block;font-size:9.5px;padding:1px 5px;border-radius:4px;background:var(--card);color:#bdbdc4;margin-right:4px;text-transform:uppercase;letter-spacing:.03em}
.msg{font-size:12px;color:var(--dim);padding:10px;border:1px solid var(--line2);border-radius:10px;background:var(--panel2);margin:8px 0;line-height:1.45}
.msg.err{border-color:#ff6b6b55;color:#ffb3b3}
.stage{grid-area:stage;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel)}
.phead{padding:10px 14px;font-weight:600;font-size:12.5px;color:var(--dim);display:flex;align-items:center;justify-content:space-between}
.viewport{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:4px 14px;position:relative;overflow:hidden}
.cvwrap{position:relative;background:#000;box-shadow:0 0 0 1px var(--line2)}
.cvwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{touch-action:none;inset:-24px;width:calc(100% + 48px);height:calc(100% + 48px);z-index:2}
.transport{display:flex;align-items:center;gap:8px;padding:6px 12px 10px}
.time{font-family:"SF Mono",ui-monospace,Consolas,monospace;font-size:12px;color:var(--dim);min-width:200px;font-variant-numeric:tabular-nums}
.time b{color:var(--text);font-weight:600}
.transport .mid{flex:1;display:flex;justify-content:center;align-items:center;gap:6px}
#play{width:40px;height:40px;border-radius:50%;padding:0;background:var(--text);color:#0b0b0d}
#play:hover{background:#fff}
#play svg{fill:currentColor;stroke:none}
.transport select{width:auto;padding:5px 8px;font-size:12px}
.side{grid-area:side;background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;padding:0 8px;gap:2px;border-bottom:1px solid var(--line)}
.tabs button{background:transparent;color:var(--dim);padding:13px 10px 11px;border-radius:0;font-weight:600;border:0}
.tabs button:hover{color:var(--text);background:transparent}
.tabs button.on{background:transparent;color:var(--text);box-shadow:inset 0 -2px 0 var(--accent)}
.pane{flex:1;overflow:auto;padding:6px 14px 16px}
.note{font-size:12px;color:var(--dim);line-height:1.5}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.sect{border-top:1px solid var(--line);margin-top:14px;padding-top:4px}
.sect h4{margin:10px 0 0;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;justify-content:space-between}
.sect h4 button{padding:3px 8px;font-size:11px;text-transform:none;letter-spacing:0}
.num{display:flex;align-items:center;gap:6px}
.num span{font-size:11px;color:var(--dim);width:14px}
.credit{font-size:12px;line-height:1.5;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:10px;margin-top:10px}
.credit a{color:var(--accent);text-decoration:none}.credit a:hover{text-decoration:underline}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.tgrid button{font-size:11px;padding:7px 4px;text-transform:capitalize;overflow:hidden;text-overflow:ellipsis}
/* AI sidebar */
.ai{grid-area:ai;background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;border-left:1px solid var(--line)}
.app.noai .ai{display:none}
.aihead{display:flex;align-items:center;gap:6px;padding:10px 10px 10px 14px;border-bottom:1px solid var(--line)}
.aihead .ttl{display:flex;align-items:center;gap:8px;font-weight:700;flex:1}
.aihead .ttl svg{color:var(--accent)}
.ailog{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.ai-msg{padding:10px 12px;border-radius:12px;background:var(--card);white-space:pre-wrap;line-height:1.5;max-width:92%;align-self:flex-start;border:1px solid var(--line2);word-wrap:break-word}
.ai-msg.me{background:var(--accent-a);border-color:#ff5a3650;align-self:flex-end}
.ai-msg small{display:flex;align-items:center;gap:5px;color:var(--accent);margin-top:6px;font-size:11px}
.ai-msg.typing{color:var(--dim)}
.ai-msg.typing i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--dim);margin-right:3px;animation:blink 1s infinite}
.ai-msg.typing i:nth-child(2){animation-delay:.2s}.ai-msg.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.25}}
.aiquick{padding:0 14px 8px}
.aiquick .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.aiquick .chips button{font-size:11.5px;flex:none}
.ai.full .aiquick .chips{flex-wrap:wrap}
.aicompose{padding:10px 12px 12px;border-top:1px solid var(--line)}
.aibox{display:flex;align-items:flex-end;gap:8px;background:var(--panel2);border:1px solid var(--line2);border-radius:14px;padding:6px 6px 6px 12px;transition:border-color .12s}
.aibox:focus-within{border-color:var(--accent)}
.aibox textarea{border:0;background:transparent;padding:6px 0;resize:none;min-height:22px;max-height:38vh;line-height:1.45;overflow-y:auto}
.aibox button{width:34px;height:34px;padding:0;border-radius:10px;flex:none}
.aihint{font-size:11px;color:var(--faint);margin-top:6px;padding-left:2px}
.ai.full{position:fixed;inset:0;z-index:80;border:0;background:var(--bg)}
.ai.full .ailog,.ai.full .aiquick,.ai.full .aicompose{width:min(860px,100%);margin:0 auto;align-self:center}
.ai.full .ailog{width:min(860px,100%);font-size:14px}
.ai.full .aibox textarea{max-height:50vh;font-size:14px}
.ai.full .ai-msg{max-width:80%}
/* timeline */
.tl{grid-area:tl;background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tlbar{display:flex;align-items:center;gap:2px;padding:5px 10px;border-bottom:1px solid var(--line)}
.tlbar .sep{width:1px;height:18px;background:var(--line2);margin:0 6px}
.tlscroll{flex:1;overflow:auto;position:relative;background:var(--track)}
.tlinner{position:relative;min-width:100%;padding-left:76px;padding-bottom:12px}
.ruler{height:26px;position:relative;cursor:pointer;font-size:10px;color:#5f5f69;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line)}
.ruler span{position:absolute;top:4px;margin-left:4px}
.ruler i{position:absolute;bottom:0;width:1px;height:8px;background:#2f2f37}
.ruler i.mn{height:4px;background:#24242a}
.track{position:relative;height:34px;margin:5px 0}
.track.v{height:62px}
.track.a{height:40px}
.tlabel{position:sticky;left:0;z-index:7;width:76px;margin-left:-76px;height:100%;display:flex;align-items:center;justify-content:center;color:#5d5d66;background:var(--track);float:left}
.blk{position:absolute;top:0;bottom:0;border-radius:6px;overflow:hidden;cursor:grab;font-size:11px;padding:3px 9px;white-space:nowrap;text-overflow:ellipsis;user-select:none;box-shadow:inset 0 0 0 1px #ffffff12;display:flex;align-items:flex-start;gap:5px;transition:box-shadow .15s}
.blk svg{width:12px;height:12px;flex:none;margin-top:1px}
.blk.sel{box-shadow:inset 0 0 0 2px #fff}
.blk.video{background:#18232a left/auto 100% repeat-x;padding-top:4px;text-shadow:0 1px 2px #000,0 0 6px #000}
.blk.video::before{content:'';position:absolute;inset:auto 0 0 0;height:18px;background:linear-gradient(transparent,#000b);pointer-events:none}
.blk.text{background:#5a3412;color:#ffe8d2;font-weight:600;align-items:center}
.blk.audio{background:#0f2e25 left/auto 100% no-repeat;color:#c9f5e3;padding-top:3px}
.blk.audio.nowave{background-image:repeating-linear-gradient(90deg,#34d39940 0 2px,transparent 2px 5px)}
.blk .eL,.blk .eR{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;z-index:3}
.blk.sel .eL,.blk.sel .eR{background:#fff}
.blk.sel .eL::after,.blk.sel .eR::after{content:'';position:absolute;left:3px;top:35%;bottom:35%;width:2px;border-radius:2px;background:#0008}
.blk .eL{left:0}.blk .eR{right:0}
.blk .fi,.blk .fo{position:absolute;top:0;bottom:0;pointer-events:none;z-index:1}
.blk .fi{left:0;background:linear-gradient(to bottom right,#000a 49%,transparent 51%)}
.blk .fo{right:0;background:linear-gradient(to bottom left,#000a 49%,transparent 51%)}
.blk .mut{position:absolute;right:12px;bottom:4px;opacity:.85}
.tr{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:7px;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;z-index:5;cursor:pointer;box-shadow:0 2px 8px #000}
.tr svg{width:13px;height:13px}
.tr.none{background:#1f1f25;color:#aaa;opacity:0;transition:opacity .15s;border:1px solid var(--line2)}
.track.v:hover .tr.none{opacity:1}
.playhead{position:absolute;top:0;bottom:0;width:1.5px;background:var(--accent);z-index:8;pointer-events:none}
.playhead::before{content:'';position:absolute;top:0;left:-5.5px;width:12.5px;height:14px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 60%,50% 100%,0 60%)}
.blk.lift{z-index:9;box-shadow:0 10px 26px #000c,0 0 0 2px var(--accent);cursor:grabbing;opacity:.92;transition:none}
.blk.dropT{box-shadow:inset 0 0 0 3px var(--accent),0 0 18px var(--accent)}
.ins{position:absolute;top:2px;bottom:2px;width:4px;margin-left:-2px;background:var(--accent);border-radius:3px;z-index:8;box-shadow:0 0 12px var(--accent);display:none}
.track.over{background:#ff5a3612}
.zoomv{font-size:11px;color:var(--dim);width:38px;text-align:center;font-variant-numeric:tabular-nums}
/* overlays */
.overlay{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:90;backdrop-filter:blur(4px)}
.overlay.show{display:flex}
.box{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:22px;width:420px;box-shadow:0 20px 60px #000}
.box h3{margin:0 0 6px;display:flex;align-items:center;gap:8px}
.bar{height:6px;background:var(--card);border-radius:9px;overflow:hidden;margin:14px 0}
.bar div{height:100%;width:0;background:var(--accent)}
.ctx{position:fixed;z-index:95;background:#141418;border:1px solid var(--line2);border-radius:12px;padding:5px;min-width:220px;box-shadow:0 14px 44px #000e;display:none;animation:pop .12s ease-out}
.ctx.show{display:block}
.ctx .it{padding:7px 10px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:13px}
.ctx .it svg{width:15px;height:15px;color:#a9a9b1}
.ctx .it .k{margin-left:auto;color:var(--dim);font-size:11px;padding-left:16px}
.ctx .it:hover{background:var(--card)}
.ctx .it.danger{color:var(--danger)}.ctx .it.danger svg{color:var(--danger)}
.ctx hr{border:0;border-top:1px solid var(--line2);margin:4px 0}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.dragghost{position:fixed;pointer-events:none;z-index:96;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:12px;padding:6px 10px;border-radius:8px;box-shadow:0 8px 24px #000a;transform:translate(-50%,-130%);display:none;text-transform:capitalize}
.tip{position:fixed;z-index:99;pointer-events:none;background:#f2f2f4;color:#111;font-size:11.5px;font-weight:600;padding:5px 8px;border-radius:6px;box-shadow:0 6px 18px #000a;opacity:0;transition:opacity .1s;white-space:nowrap}
.tip.show{opacity:1}
.tip kbd{font:inherit;font-weight:500;color:#666;margin-left:6px}
.toast{position:fixed;left:50%;top:58px;transform:translateX(-50%);background:#1d1d23;border:1px solid var(--line2);padding:9px 14px;border-radius:10px;z-index:98;box-shadow:0 10px 30px #000c;display:none;font-size:12.5px;max-width:520px}
svg.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.toast.show{display:block;animation:pop .15s ease-out}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <div class="logo"><span id="logoMark"></span><span id="appName"></span></div>
    <button class="ib" id="undo" data-tip="Undo" data-key="Ctrl+Z"><i data-ic="undo"></i></button>

/* =====================================================================
   IMPORT
   ===================================================================== */
function guessType(name, mime){
  if(mime){ if(mime.startsWith('video')) return 'video'; if(mime.startsWith('image')) return 'image'; if(mime.startsWith('audio')) return 'audio'; }
  const ext = (name.split('.').pop() || '').toLowerCase();
  if(['mp4','webm','mov','mkv','m4v','ogv'].includes(ext)) return 'video';
  if(['png','jpg','jpeg','gif','webp','bmp','avif'].includes(ext)) return 'image';
  if(['mp3','wav','ogg','oga','m4a','aac','flac','opus','weba'].includes(ext)) return 'audio';
  return null;
}
async function importOne(blob, name, extra = {}){
  const type = extra.type || guessType(name, blob.type); if(!type) return null;
  const m = Object.assign({ id:uid(), name, type, url:URL.createObjectURL(blob), duration:3 }, extra, {type});
  if(type === 'image'){
    m.el = new Image(); m.el.src = m.url; await m.el.decode().catch(() => {}); m.thumb = m.url;
  } else {
    m.el = document.createElement(type === 'video' ? 'video' : 'audio');
    m.el.preload = 'auto'; m.el.playsInline = true; m.el.src = m.url;
    await new Promise(r => { m.el.onloadedmetadata = r; m.el.onerror = r; setTimeout(r, 15000); });
    m.duration = isFinite(m.el.duration) && m.el.duration > 0 ? m.el.duration : (extra.duration || 10);
    if(type === 'video'){
      m.snap = document.createElement('video'); m.snap.src = m.url; m.snap.muted = true; m.snap.preload = 'auto';
      m.thumb = await grabFrame(m, Math.min(.5, m.duration / 2), 160, 100);
      buildStrip(m);
    }
    if(blob.size < 250e6) computeWave(m, blob);
  }
  media[m.id] = m; return m;
}
async function importFiles(files){
  initAudio(); let n = 0;
  flash(`Importing ${files.length} file${files.length > 1 ? 's' : ''}`);
  for(const f of files){ const m = await importOne(f, f.name); if(m) n++; else flash(`${f.name} is not a supported file`); renderLib(); }
  if(n) flash(`Imported ${n} file${n > 1 ? 's' : ''}`);
}
async function computeWave(m, blob){
  try{
    initAudio();
    const buf = await actx.decodeAudioData(await blob.arrayBuffer()), d = buf.getChannelData(0);
    const w = Math.min(6000, Math.max(60, Math.ceil(buf.duration * 50))), h = 56, step = Math.max(1, Math.floor(d.length / w));
    const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.fillStyle = '#3ee0a1';
    let peak = .01; const pk = [];
    for(let x = 0; x < w; x++){ let mx = 0; for(let i = x*step; i < (x + 1)*step; i += 16){ const v = Math.abs(d[i] || 0); if(v > mx) mx = v; } pk.push(mx); if(mx > peak) peak = mx; }
    pk.forEach((v, x) => { const bh = Math.max(1, v / peak * (h - 8)); g.fillRect(x, (h - bh) / 2 + 5, .9, bh); });
    m.wave = c.toDataURL('image/png');
    Object.values(media).forEach(o => { if(o.url === m.url && !o.wave) o.wave = m.wave; });
    renderTimeline();
  }catch(e){ /* no decodable audio */ }
}
function grabFrame(m, time, w, h, v){
  return new Promise(res => {
    const own = !v; v = v || document.createElement('video'); if(own){ v.src = m.url; v.muted = true; v.preload = 'auto'; }
    const done = () => { try{ const c = document.createElement('canvas'); c.width = w; c.height = h;
      const k = Math.max(w / v.videoWidth, h / v.videoHeight), dw = v.videoWidth * k, dh = v.videoHeight * k;
      c.getContext('2d').drawImage(v, (w - dw) / 2, (h - dh) / 2, dw, dh); res(c.toDataURL('image/jpeg', .7)); }catch(e){ res(''); } };
    const go = () => { v.onseeked = () => { v.onseeked = null; done(); }; v.currentTime = clamp(time, 0, Math.max(0, (v.duration || m.duration) - .05)); };
    if(v.readyState >= 1) go(); else { v.onloadedmetadata = go; }
    v.onerror = () => res(''); setTimeout(() => res(''), 8000);
  });
}
async function buildStrip(m){
  const n = clamp(Math.ceil(m.duration / 1.5), 2, 24), fw = 72, fh = 58;
  const c = document.createElement('canvas'); c.width = fw * n; c.height = fh; const g = c.getContext('2d');
  const v = document.createElement('video'); v.src = m.url; v.muted = true; v.preload = 'auto';
  for(let i = 0; i < n; i++){
    const url = await grabFrame(m, (i + .5) * m.duration / n, fw, fh, v); if(!url) continue;
    const img = new Image(); img.src = url; await img.decode().catch(() => {}); g.drawImage(img, i * fw, 0);
  }
  m.strip = c.toDataURL('image/jpeg', .7); renderTimeline();
}
function addToTimeline(id, at){
  const m = media[id]; if(!m) return; snapshot();
  if(m.type === 'audio'){ const a = newAudio(id, at ?? t); project.audios.push(a); sel = {kind:'audio', id:a.id}; }
  else { const c = newClip(id); project.clips.push(c); sel = {kind:'clip', id:c.id}; }
  afterChange();
}
function mediaUses(id){ return project.clips.filter(c => c.mediaId === id).length + project.audios.filter(a => a.mediaId === id).length; }
async function deleteMedia(id){
  const m = media[id]; if(!m) return; const n = mediaUses(id);
  if(n && !await confirmBox('Delete this file?', `"${m.name}" is used ${n} time${n > 1 ? 's' : ''} on the timeline. Deleting it also removes ${n > 1 ? 'those clips' : 'that clip'}. You can undo with Ctrl+Z.`, 'Delete file and clips')) return;
  if(n){ snapshot(); project.clips = project.clips.filter(c => c.mediaId !== id); project.audios = project.audios.filter(a => a.mediaId !== id); }
  m.deleted = true; if(m.el && m.el.pause) m.el.pause();
  afterChange(); renderLib(); flash(`Deleted ${m.name}`);
}

/* =====================================================================
   EASING
   ===================================================================== */
const EASE = {
  linear: p => p,
  easeIn: p => p * p * p,
  easeOut: p => 1 - Math.pow(1 - p, 3),
  easeInOut: p => p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2,
  smooth: p => p * p * (3 - 2 * p),
  expo: p => p === 0 ? 0 : p === 1 ? 1 : p < .5 ? Math.pow(2, 20*p - 10) / 2 : (2 - Math.pow(2, -20*p + 10)) / 2,
  back: p => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); },
  bounce: p => { const n = 7.5625, d = 2.75; if(p < 1/d) return n*p*p; if(p < 2/d) return n*(p -= 1.5/d)*p + .75; if(p < 2.5/d) return n*(p -= 2.25/d)*p + .9375; return n*(p -= 2.625/d)*p + .984375; },
  elastic: p => p === 0 || p === 1 ? p : Math.pow(2, -10*p) * Math.sin((p*10 - .75) * (2*Math.PI/3)) + 1
};
const EASE_LABEL = {linear:'Linear', easeIn:'Ease in', easeOut:'Ease out', easeInOut:'Ease in-out', smooth:'Smooth', expo:'Expo', back:'Overshoot', bounce:'Bounce', elastic:'Elastic'};

/* =====================================================================
   TRANSITIONS  (draw functions: c = target ctx, A = outgoing frame, B = incoming frame, p = 0..1)
   ===================================================================== */
const T = {}, TCAT = {}, CATS = [];
function def(cat, name, fn){ T[name] = fn; TCAT[name] = cat; if(!CATS.includes(cat)) CATS.push(cat); }
const full = (c, img, x = 0, y = 0, w = W, h = H) => c.drawImage(img, x, y, w, h);
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const S = p => Math.sin(p * Math.PI);
function scaled(c, img, s, rot = 0, alpha = 1, ox = W/2, oy = H/2){
  c.save(); c.globalAlpha = clamp(alpha, 0, 1); c.translate(ox, oy); c.rotate(rot); c.scale(s, s); c.drawImage(img, -ox, -oy, W, H); c.restore();
}
function clipDraw(c, A, B, pathFn){ full(c, A); c.save(); c.beginPath(); pathFn(c); c.clip(); full(c, B); c.restore(); }
const tmps = {};
function tmp(i){ const k = `${W}x${H}x${i}`; let cc = tmps[k]; if(!cc){ cc = tmps[k] = document.createElement('canvas'); cc.width = W; cc.height = H; } return cc; }
function maskDraw(c, A, B, paint){
  full(c, A); const m = tmp(0), g = m.getContext('2d');
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1; g.clearRect(0, 0, W, H); g.drawImage(B, 0, 0, W, H);
  g.globalCompositeOperation = 'destination-in'; paint(g); g.globalCompositeOperation = 'source-over'; c.drawImage(m, 0, 0);
}
function withFilter(c, f, fn){ c.save(); c.filter = f; fn(); c.restore(); }
function overlayFill(c, style, alpha, op = 'source-over'){ c.save(); c.globalCompositeOperation = op; c.globalAlpha = clamp(alpha, 0, 1); c.fillStyle = style; c.fillRect(0, 0, W, H); c.restore(); }
function strips(c, img, x0, w, hL, hR, shade){        // pseudo-perspective panel
  const n = 28;
  for(let i = 0; i < n; i++){
    const f = (i + .5) / n, hh = (hL + (hR - hL) * f) * H, dw = w / n;
    c.drawImage(img, i * W / n, 0, W / n + 1, H, x0 + i * dw, (H - hh) / 2, dw + 1, hh);
  }

}
const DIRS = { left:[-1,0], right:[1,0], up:[0,-1], down:[0,1] };
const R = () => Math.hypot(W, H) / 2;

/* --- Fades --- */
def('Fades', 'fade', (c,A,B,p) => { full(c,A); c.globalAlpha = p; full(c,B); c.globalAlpha = 1; });
def('Fades', 'dip to black', (c,A,B,p) => { full(c, p < .5 ? A : B); overlayFill(c, '#000', 1 - Math.abs(p - .5) * 2); });
def('Fades', 'dip to white', (c,A,B,p) => { full(c, p < .5 ? A : B); overlayFill(c, '#fff', 1 - Math.abs(p - .5) * 2); });
def('Fades', 'dip to ember', (c,A,B,p) => { full(c, p < .5 ? A : B); overlayFill(c, '#ff5a36', 1 - Math.abs(p - .5) * 2); });
def('Fades', 'flash', (c,A,B,p) => { full(c, p < .5 ? A : B); overlayFill(c, '#fff', Math.pow(1 - Math.abs(p - .5) * 2, 3)); });
def('Fades', 'additive', (c,A,B,p) => { c.save(); full(c,A); c.globalCompositeOperation = 'lighter'; c.globalAlpha = p; full(c,B); c.restore(); c.save(); c.globalAlpha = p * p; full(c,B); c.restore(); });
def('Fades', 'soft fade', (c,A,B,p) => { full(c,A); scaled(c,B, 1.06 - .06*p, 0, p); });
def('Fades', 'exposure', (c,A,B,p) => withFilter(c, `brightness(${1 + 2.5*S(p)})`, () => full(c, p < .5 ? A : B)));

/* --- Wipes --- */
for(const [d,[dx,dy]] of Object.entries(DIRS)){
  def('Wipes', 'wipe ' + d, (c,A,B,p) => clipDraw(c,A,B, k => {
    if(dx > 0) k.rect(0,0,W*p,H); else if(dx < 0) k.rect(W*(1-p),0,W*p,H); else if(dy > 0) k.rect(0,0,W,H*p); else k.rect(0,H*(1-p),W,H*p); }));
  def('Wipes', 'soft wipe ' + d, (c,A,B,p) => maskDraw(c,A,B, g => {
    const L = dx ? W : H, f = L * .35, e = p * (L + f), pos = s => dx > 0 ? [s,0] : dx < 0 ? [W - s,0] : dy > 0 ? [0,s] : [0,H - s];
    const gr = g.createLinearGradient(...pos(e - f), ...pos(e)); gr.addColorStop(0, '#000'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0,0,W,H); }));
}
[['top-left',0,0],['top-right',1,0],['bottom-left',0,1],['bottom-right',1,1]].forEach(([n,fx,fy]) => {
  def('Wipes', 'diagonal ' + n, (c,A,B,p) => clipDraw(c,A,B, k => { const s = p * (W + H) * 1.02, Pt = (x,y) => [fx ? W - x : x, fy ? H - y : y];
    k.moveTo(...Pt(0,0)); k.lineTo(...Pt(s,0)); k.lineTo(...Pt(0,s)); k.closePath(); }));
});
def('Wipes', 'clock wipe', (c,A,B,p) => clipDraw(c,A,B, k => { k.moveTo(W/2,H/2); k.arc(W/2,H/2, R()*1.1, -Math.PI/2, -Math.PI/2 + p*Math.PI*2); k.closePath(); }));
def('Wipes', 'clock wipe reverse', (c,A,B,p) => clipDraw(c,A,B, k => { k.moveTo(W/2,H/2); k.arc(W/2,H/2, R()*1.1, -Math.PI/2, -Math.PI/2 - p*Math.PI*2, true); k.closePath(); }));
def('Wipes', 'fan', (c,A,B,p) => clipDraw(c,A,B, k => { for(let i = 0; i < 4; i++){ const a = i*Math.PI/2; k.moveTo(W/2,H/2); k.arc(W/2,H/2, R()*1.1, a, a + p*Math.PI/2); k.closePath(); } }));
def('Wipes', 'barn door horizontal', (c,A,B,p) => clipDraw(c,A,B, k => k.rect(W/2*(1-p), 0, W*p, H)));
def('Wipes', 'barn door vertical', (c,A,B,p) => clipDraw(c,A,B, k => k.rect(0, H/2*(1-p), W, H*p)));
def('Wipes', 'wave wipe', (c,A,B,p) => clipDraw(c,A,B, k => { const e = p * W * 1.3 - W * .15; k.moveTo(0,0);
  for(let y = 0; y <= H; y += H/40) k.lineTo(e + Math.sin(y/H*Math.PI*4 + p*8) * W*.07, y); k.lineTo(0,H); k.closePath(); }));
def('Wipes', 'zigzag wipe', (c,A,B,p) => clipDraw(c,A,B, k => { const e = p * W * 1.25 - W * .12, a = W * .06, n = 10; k.moveTo(0,0);

def('Wipes', 'blinds horizontal', (c,A,B,p) => clipDraw(c,A,B, k => { const n = 10, h = H/n; for(let i = 0; i < n; i++) k.rect(0, i*h, W, h*p + .5); }));
def('Wipes', 'blinds vertical', (c,A,B,p) => clipDraw(c,A,B, k => { const n = 10, w = W/n; for(let i = 0; i < n; i++) k.rect(i*w, 0, w*p + .5, H); }));
def('Wipes', 'stripes', (c,A,B,p) => clipDraw(c,A,B, k => { const n = 12, w = (W + H)/n; for(let i = -1; i < n + 1; i++){ const q = clamp(p*1.6 - i/n*.6, 0, 1);

def('Wipes', 'checkerboard', (c,A,B,p) => clipDraw(c,A,B, k => { const n = 8, w = W/n, rows = Math.ceil(H/w);

/* --- Slides --- */
for(const [d,[dx,dy]] of Object.entries(DIRS)){

/* --- Zooms --- */
def('Zooms', 'zoom in', (c,A,B,p) => { scaled(c,A, 1 + p*1.5, 0, 1); scaled(c,B, .6 + .4*p, 0, p); });

def('Zooms', 'dolly in', (c,A,B,p) => { scaled(c,A, 1 + .15*p); scaled(c,B, 1.15 - .15*p, 0, p); });

/* --- Spins --- */
def('Spins', 'spin in', (c,A,B,p) => { full(c,A); scaled(c,B, Math.max(p, .001), (1-p)*-Math.PI*1.5, 1); });
def('Spins', 'spin out', (c,A,B,p) => { full(c,B); scaled(c,A, Math.max(1 - p, .001), p*Math.PI*1.5, 1 - p*.3); });
def('Spins', 'spin clockwise', (c,A,B,p) => { c.fillStyle = '#000'; c.fillRect(0,0,W,H); scaled(c, p < .5 ? A : B, 1 - .45*S(p), p*Math.PI*2); });
def('Spins', 'spin counterclockwise', (c,A,B,p) => { c.fillStyle = '#000'; c.fillRect(0,0,W,H); scaled(c, p < .5 ? A : B, 1 - .45*S(p), -p*Math.PI*2); });
def('Spins', 'roll left', (c,A,B,p) => { c.fillStyle = '#000'; c.fillRect(0,0,W,H); const a = .9; scaled(c, A, 1, -p*a, 1, W/2, H*2.2); scaled(c, B, 1, (1-p)*a, 1, W/2, H*2.2); });

def('Spins', 'swirl', (c,A,B,p) => { scaled(c, A, 1 + p*.4, p*Math.PI*.5, 1); scaled(c, B, Math.max(.001, p), -(1-p)*Math.PI, p); });

/* --- Flips --- */
def('Flips', 'flip horizontal', (c,A,B,p) => { c.fillStyle = '#000'; c.fillRect(0,0,W,H); const k = Math.abs(Math.cos(p*Math.PI)); full(c, p < .5 ? A : B, W/2*(1-k), 0, W*k, H); });
def('Flips', 'flip vertical', (c,A,B,p) => { c.fillStyle = '#000'; c.fillRect(0,0,W,H); const k = Math.abs(Math.cos(p*Math.PI)); full(c, p < .5 ? A : B, 0, H/2*(1-k), W, H*k); });
def('Flips', 'card flip left', (c,A,B,p) => { c.fillStyle = '#000'; c.fillRect(0,0,W,H); const k = Math.abs(Math.cos(p*Math.PI)), w = W*k, img = p < .5 ? A : B, s = .25*S(p);

const FILTERS = {

  teal:'hue-rotate(-18deg) saturate(1.3) contrast(1.1)', dusk:'sepia(.3) hue-rotate(-30deg) saturate(1.4) brightness(.95)', mono:'grayscale(1)', punch:'contrast(1.35) saturate(1.3)'

}

  if(clip.fit === 'blur'){
    tiny.width = Math.max(8, W/24|0); tiny.height = Math.max(8, H/24|0);
    const kc = Math.max(tiny.width/br.sw, tiny.height/br.sh); tinyCtx.drawImage(el, (tiny.width - br.sw*kc)/2, (tiny.height - br.sh*kc)/2, br.sw*kc, br.sh*kc);
    c2.filter = filterCss(clip) + ` brightness(.6) blur(${px(10)}px)`; c2.drawImage(tiny, -px(20), -px(20), W + px(40), H + px(40));
  }
  c2.filter = filterCss(clip);
  c2.translate((clip.x ?? .5) * W, (clip.y ?? .5) * H); c2.rotate((clip.r || 0) * Math.PI / 180); c2.scale(clip.sx ?? 1, clip.sy ?? 1);
  c2.drawImage(el, -br.bw/2, -br.bh/2, br.bw, br.bh);
  c2.restore();
}
const cacheKey = c => [c.mediaId, c.out, c.fit, c.filter, c.bright, c.contrast, c.sat, c.zoom, c.x, c.y, c.sx, c.sy, c.r, W, H].join('|');

  const m = media[clip.mediaId]; if(!m) return black;

  if(e.key !== cacheKey(clip)){ e.ok = false; e.key = cacheKey(clip); }
  if(e.ok) return e.cv;
  if(m.type === 'image'){ drawSource(e.cv.getContext('2d'), clip, m.el, 1); e.ok = true; return e.cv; }
  if(!e.busy && m.snap){ e.busy = true; const key = e.key;
    m.snap.onseeked = () => { if(e.key === key){ drawSource(e.cv.getContext('2d'), clip, m.snap, 1); e.ok = true; } e.busy = false; };
    m.snap.currentTime = Math.max(0, clip.out - .05); }
  return e.ok ? e.cv : black;
}
let textBoxes = [];
function drawTexts(time){
  textBoxes = [];
  for(const x of project.texts){
    if(time < x.start || time > x.start + x.dur) continue;
    const lt = time - x.start, inP = clamp(lt / .4, 0, 1), outP = clamp((x.start + x.dur - time) / .4, 0, 1), p = Math.min(inP, outP);
    let alpha = 1, sc = 1, dy = 0, txt = x.text;
    if(x.anim === 'fade') alpha = p;
    if(x.anim === 'pop'){ sc = Math.max(.01, EASE.back(p)); alpha = Math.min(1, p*2); }
    if(x.anim === 'slide up'){ dy = (1 - EASE.easeOut(p)) * px(80); alpha = p; }
    if(x.anim === 'bounce'){ sc = Math.max(.01, EASE.bounce(inP)); alpha = outP; }
    if(x.anim === 'typewriter'){ txt = x.text.slice(0, Math.ceil(x.text.length * clamp(lt / Math.max(.5, x.dur*.5), 0, 1))); alpha = outP; }
    const size = x.size * Math.min(W, H) / 1080, lines = String(txt).split('\n'), allLines = String(x.text).split('\n');
    ctx.save(); ctx.font = `${x.font === 'Inter' ? '800 ' : ''}${size}px "${x.font}"`;
    const lh = size * 1.15, wMax = Math.max(...allLines.map(l => ctx.measureText(l).width), size * .6), hTot = lh * allLines.length, pad = size * .3;
    ctx.globalAlpha = clamp(alpha, 0, 1); ctx.translate(x.x * W, x.y * H + dy); ctx.rotate((x.r || 0) * Math.PI / 180); ctx.scale((x.sx ?? 1) * sc, (x.sy ?? 1) * sc);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if(x.bg){ ctx.fillStyle = x.bg; ctx.beginPath(); ctx.roundRect(-wMax/2 - pad, -hTot/2 - pad*.6, wMax + pad*2, hTot + pad*1.2, size*.25); ctx.fill(); }
    lines.forEach((l, i) => { const y = -hTot/2 + lh*(i + .5);
      if(x.stroke){ ctx.lineWidth = size * .14; ctx.strokeStyle = x.stroke; ctx.lineJoin = 'round'; ctx.strokeText(l, 0, y); }
      ctx.fillStyle = x.color; ctx.fillText(l, 0, y); });
    ctx.restore();
    textBoxes.push({kind:'text', id:x.id, cx:x.x*W, cy:x.y*H, w:wMax + pad*2, h:hTot + pad*1.2, sx:x.sx ?? 1, sy:x.sy ?? 1, r:x.r || 0});
  }
}
let clipBox = null;
